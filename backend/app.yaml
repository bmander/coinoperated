runtime: python312
service: coinop
entrypoint: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind :$PORT

env_variables:
  BASE_PATH: "/coinop"
  FRONTEND_URL: "https://bmander.com/coinop"
  CORS_ORIGINS: '["https://bmander.com"]'

includes:
  - env.yaml  # gitignored — contains SECRET_KEY, DATABASE_URL, STRIPE_*, SMTP_*

handlers:
  - url: /coinop/assets
    static_dir: static/assets
    secure: always
  - url: /coinop/api/.*
    script: auto
    secure: always
  - url: /coinop(/.*)?
    static_files: static/index.html
    upload: static/index.html
    secure: always
