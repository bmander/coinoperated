[project]
name = "coinoperated-backend"
version = "0.1.0"
description = "CoinOperatedBrandon API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.0",
    "stripe>=8.0",
    "aiosmtplib>=3.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "PIE",    # flake8-pie
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "FAST",   # fastapi
    "FURB",   # refurb
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (let formatter handle it)
    "RET504", # unnecessary-assign-before-return (can aid readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20"]           # allow assert and print in tests
"alembic/**" = ["UP", "I", "RUF"]      # don't fuss over generated migrations

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
