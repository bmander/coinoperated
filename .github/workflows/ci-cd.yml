name: CI/CD

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npx vitest run
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coinoperated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Run backend tests
        run: pytest tests/ -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coinoperated_test

  deploy:
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npx vite build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /coinop/

      - name: Copy frontend dist to backend static
        run: |
          rm -rf backend/static
          cp -r frontend/dist backend/static

      - name: Inject secret env vars into app.yaml
        run: |
          sed -i '/CORS_ORIGINS/r /dev/stdin' backend/app.yaml << SECRETS
            SECRET_KEY: "${{ secrets.SECRET_KEY }}"
            DATABASE_URL: "${{ secrets.DATABASE_URL }}"
            STRIPE_PUBLISHABLE_KEY: "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
            STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"
            STRIPE_WEBHOOK_SECRET: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            ADMIN_EMAIL: "${{ secrets.ADMIN_EMAIL }}"
            SMTP_HOST: "${{ secrets.SMTP_HOST }}"
            SMTP_PORT: "${{ secrets.SMTP_PORT }}"
            SMTP_USER: "${{ secrets.SMTP_USER }}"
            SMTP_PASSWORD: "${{ secrets.SMTP_PASSWORD }}"
            SMTP_FROM_EMAIL: "${{ secrets.SMTP_FROM_EMAIL }}"
          SECRETS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Run database migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to App Engine
        run: gcloud app deploy --quiet
        working-directory: backend

      - name: Deploy dispatch rules
        run: gcloud app deploy dispatch.yaml --quiet
